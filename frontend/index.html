<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duco Control</title>
  <meta name="theme-color" content="#0f668c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Duco Control</h1>
    <!-- Filled in from /status once the device model is known -->
    <p class="subtitle" id="device-subtitle" hidden></p>
  </header>

  <main>
    <section id="status-card" class="card" aria-live="polite">
      <h2>Status</h2>
      <div id="status-error" class="error" hidden></div>
      <dl class="status-grid" id="status-grid">
        <div class="stat">
          <dt>Outside</dt>
          <dd id="temp-outside">&ndash;</dd>
        </div>
        <div class="stat">
          <dt>Inside</dt>
          <dd id="temp-extract">&ndash;</dd>
        </div>
        <div class="stat">
          <dt>Humidity</dt>
          <dd id="humidity">&ndash;</dd>
        </div>
        <div class="stat">
          <dt>Filter</dt>
          <dd id="filter-days">&ndash;</dd>
        </div>
        <div class="stat">
          <dt>Bypass</dt>
          <dd id="bypass">&ndash;</dd>
        </div>
        <div class="stat">
          <dt>Current setting</dt>
          <dd id="current-state">&ndash;</dd>
        </div>
      </dl>
    </section>

    <section class="card">
      <h2>Set ventilation</h2>

      <div class="control">
        <span class="control-label">Level</span>
        <div class="level-selector" id="level-selector" role="group" aria-label="Ventilation level">
          <button type="button" class="level-button" data-level="1">Low<span>15%</span></button>
          <button type="button" class="level-button" data-level="2">Medium<span>50%</span></button>
          <button type="button" class="level-button" data-level="3">High<span>100%</span></button>
        </div>
      </div>

      <div class="control">
        <span class="control-label">Duration</span>
        <!-- Radial drag picker; see app.js for the angle-to-duration math.
             Center = unlimited. Lap rings (same radius, stacked) show
             elapsed full turns; radius must match DIAL_RING_RADIUS in app.js. -->
        <div class="duration-dial" id="duration-dial" role="slider"
             aria-label="Duration" aria-valuemin="0" aria-valuemax="240" aria-valuenow="0">
          <svg viewBox="0 0 200 200" width="200" height="200">
            <circle class="dial-track" cx="100" cy="100" r="80"></circle>
            <circle class="dial-progress-lap dial-progress-lap-0" id="dial-lap-0" cx="100" cy="100" r="80"></circle>
            <circle class="dial-progress-lap dial-progress-lap-1" id="dial-lap-1" cx="100" cy="100" r="80"></circle>
            <circle class="dial-progress-lap dial-progress-lap-2" id="dial-lap-2" cx="100" cy="100" r="80"></circle>
            <circle class="dial-progress-lap dial-progress-lap-3" id="dial-lap-3" cx="100" cy="100" r="80"></circle>
            <circle class="dial-handle" id="dial-handle" cx="100" cy="100" r="10"></circle>
          </svg>
          <div class="dial-label" id="dial-label">
            <span id="dial-value">&infin;</span>
            <span id="dial-end-time" class="dial-end-time" hidden></span>
          </div>
        </div>
      </div>

      <button id="set-button" type="button">Set</button>
      <div id="set-feedback" class="feedback" hidden></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
